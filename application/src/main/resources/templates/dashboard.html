<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f4f7fb;
        }

        .navbar-brand {
            font-weight: 700;
        }

        .hero-section {
            background: linear-gradient(135deg, #1f3c88, #3867d6);
            color: white;
            border-radius: 16px;
        }

        .summary-card {
            border: none;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        }

        .status-badge {
            min-width: 72px;
        }
    </style>
</head>

<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">EmployeeHub</span>
        <span class="text-light">Java DevOps Project</span>
    </div>
</nav>

<main class="container py-5">
    <section class="hero-section p-5 mb-4">
        <h1 class="display-6 fw-bold">Employee Management Dashboard</h1>
        <p class="lead mb-0">
            A modern Java application built for an end-to-end DevOps implementation.
        </p>
    </section>

    <section class="row g-4 mb-5">
        <div class="col-md-4">
            <div class="card summary-card p-4">
                <h6 class="text-muted">Total Employees</h6>
                <h2 class="fw-bold" th:text="${totalEmployees}">0</h2>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card summary-card p-4">
                <h6 class="text-muted">Active Employees</h6>
                <h2 class="fw-bold" th:text="${activeEmployees}">0</h2>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card summary-card p-4">
                <h6 class="text-muted">Departments</h6>
                <h2 class="fw-bold" th:text="${departments}">0</h2>
            </div>
        </div>
    </section>

    <section class="card summary-card">
        <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="mb-0">Employees</h3>
                <button class="btn btn-primary">Add Employee</button>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Role</th>
                        <th>Status</th>
                    </tr>
                    </thead>
                    <tbody>
                        <tr th:each="employee : ${employees}">
                            <td th:text="${employee.name}"></td>
                            <td th:text="${employee.department}"></td>
                            <td th:text="${employee.role}"></td>
                            <td>
                                <span
                                    class="badge status-badge"
                                    th:classappend="${employee.status == 'Active'} ? ' text-bg-success' : ' text-bg-secondary'"
                                    th:text="${employee.status}">
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
